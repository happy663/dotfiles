name: Test

on:
  push:
    branches:
      - main
  # PR は base ブランチを限定しない（全ブランチ対象）
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # nightly neovim を happy663.cachix.org から引くために Cachix を設定する。
      # 直書きの install-nix-action だけだと substituter が無く、
      # nightly neovim をソースからビルドしてしまう（実測 7〜9 分）。
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Run tests
        run: make test
