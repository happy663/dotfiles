name: Test

on:
  push:
    branches:
      - main
  # PR は base ブランチを限定しない（全ブランチ対象）
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# main への push は linux 版 ciShell を Cachix に載せる役割があるため、
# 途中でキャンセルせず最後まで走らせる（キャンセルすると push されない）。
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # nightly neovim を happy663.cachix.org から引くために Cachix を設定する。
      # build.yaml は macOS のみで darwin 版しか push しないため、linux 版の
      # nightly neovim はどこのキャッシュにも無い（実測 7〜9 分のソースビルド）。
      # main への push / 手動実行では linux 版 ciShell の依存を push し、
      # 以降の PR がキャッシュから引けるようにする。PR からは push しない。
      # nightly の rev が更新された直後（update.yaml の PR）の初回だけは遅い。
      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Run tests
        run: make test
