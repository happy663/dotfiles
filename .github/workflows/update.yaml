name: Update

on:
  schedule:
    # 毎週水曜 15:00 UTC（木曜 00:00 JST）。
    # 旧設定の "0 15 */7 * *" は「7 日ごと」ではなく「毎月 1/8/15/22/29 日」で、
    # 月末から翌月 1 日が 2 日間隔になるため曜日指定に変えている。
    # OpenCode Go drift（日曜）と曜日をずらして同時実行を避ける。
    - cron: "0 15 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 手動実行と cron が重なると auto-updates ブランチへの push が競合するため直列化する。
# 進行中の PR 作成を途中で殺さないよう、キャンセルではなく待たせる。
concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    # 実測は約 1 分。nix flake update のネットワーク待ちを見込んで余裕をとる。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Initialize log files
        run: |
          mkdir ./ci-logs
          TZ=Asia/Tokyo date > ./ci-logs/started_at.txt
          echo '' > ./ci-logs/update.md

      - name: Snapshot Neovim rev (pre-update)
        id: nvim-before
        run: |
          echo "rev=$(jq -r '.nodes["neovim-src"].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"

      - name: Update Nix Flake
        run: |
          {
            echo '### nix flake update'
            echo ''
            TZ=Asia/Tokyo date
            echo ''
            echo '```'
          } >> ./ci-logs/update.md
          nix flake update |& tee -a ./ci-logs/update.md
          echo '```' >> ./ci-logs/update.md

      - name: Collect Neovim nightly changelog
        id: neovim-collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_REV: ${{ steps.nvim-before.outputs.rev }}
        run: |
          NEW_REV=$(jq -r '.nodes["neovim-src"].locked.rev' flake.lock)
          python3 .github/scripts/neovim-changelog.py collect \
            --old "$OLD_REV" --new "$NEW_REV" --directory ./ci-logs

      - name: Setup Node for Pi
        id: pi-node
        if: hashFiles('ci-logs/neovim-input.md') != ''
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Explain Neovim changes with Pi
        id: neovim-ai
        if: hashFiles('ci-logs/neovim-input.md') != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash .github/scripts/explain-neovim-changelog.sh

      - name: Write PR body
        env:
          COLLECT_OUTCOME: ${{ steps.neovim-collect.outcome }}
          NODE_OUTCOME: ${{ steps.pi-node.outcome }}
          AI_OUTCOME: ${{ steps.neovim-ai.outcome }}
        run: |
          {
            echo '## Automated update'
            echo ''
            echo -n 'started at:  '
            cat ./ci-logs/started_at.txt
            echo -n 'finished at: '
            TZ=Asia/Tokyo date
            echo ''
            # Reserve room for Neovim evidence and the AI explanation.
            python3 - <<'PYLOG'
          from pathlib import Path
          log = Path('ci-logs/update.md').read_text(errors='replace')
          print(log[:15000])
          if len(log) > 15000:
              print('\n```\n(nix update log truncated)')
          PYLOG
            AI_ARGS=()
            if [ "$AI_OUTCOME" = success ]; then
              AI_ARGS+=(--ai-ok)
            fi
            python3 .github/scripts/neovim-changelog.py render \
              --directory ./ci-logs "${AI_ARGS[@]}"
          } > "$RUNNER_TEMP/update-pr-body.md"
          # Keep generated logs out of the update commit.
          python3 -c 'import shutil; shutil.rmtree("ci-logs")'

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.PR_ACTION_APP_ID }}
          private-key: ${{ secrets.PR_ACTION_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Automated updates"
          commit-message: "[bot] update flake.lock"
          branch: auto-updates
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          body-path: ${{ runner.temp }}/update-pr-body.md
          token: ${{ steps.app-token.outputs.token }}
          reviewers: happy663
