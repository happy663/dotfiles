name: Update

on:
  schedule:
    - cron: "0 15 */7 * *" # 3日ごと UTC 15:00 (JST 00:00)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Initialize log files
        run: |
          mkdir ./ci-logs
          TZ=Asia/Tokyo date > ./ci-logs/started_at.txt
          echo '' > ./ci-logs/update.md

      - name: Snapshot Neovim rev (pre-update)
        id: nvim-before
        run: |
          echo "rev=$(jq -r '.nodes["neovim-src"].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"

      - name: Update Nix Flake
        run: |
          {
            echo '### nix flake update'
            echo ''
            TZ=Asia/Tokyo date
            echo ''
            echo '```'
          } >> ./ci-logs/update.md
          nix flake update |& tee -a ./ci-logs/update.md
          echo '```' >> ./ci-logs/update.md

      - name: Collect Neovim nightly changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD='${{ steps.nvim-before.outputs.rev }}'
          NEW=$(jq -r '.nodes["neovim-src"].locked.rev' flake.lock)
          {
            echo ''
            echo '### neovim nightly changes'
            echo ''
          } >> ./ci-logs/update.md
          if [ -z "$OLD" ] || [ -z "$NEW" ] || [ "$OLD" = "$NEW" ]; then
            echo '(no neovim changes)' >> ./ci-logs/update.md
            exit 0
          fi
          echo "compare: [\`${OLD:0:7}...${NEW:0:7}\`](https://github.com/neovim/neovim/compare/${OLD}...${NEW})" >> ./ci-logs/update.md
          echo '' >> ./ci-logs/update.md
          HEADLINES=$(gh api "repos/neovim/neovim/compare/${OLD}...${NEW}" --paginate --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null || true)
          if [ -z "$HEADLINES" ]; then
            echo '(failed to fetch commit range)' >> ./ci-logs/update.md
            exit 0
          fi
          TOTAL=$(printf '%s\n' "$HEADLINES" | grep -c . || true)
          echo "total commits: ${TOTAL}" >> ./ci-logs/update.md
          echo '' >> ./ci-logs/update.md
          BREAKING=$(printf '%s\n' "$HEADLINES" | grep -E '^(feat|fix|refactor|perf)(\([^)]+\))?!:' || true)
          if [ -n "$BREAKING" ]; then
            {
              echo '#### breaking'
              echo ''
              printf '%s\n' "$BREAKING" | sed 's/^/- /'
              echo ''
            } >> ./ci-logs/update.md
          fi
          FEATS=$(printf '%s\n' "$HEADLINES" | grep -E '^feat(\([^)]+\))?:' || true)
          if [ -n "$FEATS" ]; then
            {
              echo '#### feat'
              echo ''
              printf '%s\n' "$FEATS" | sed 's/^/- /'
              echo ''
            } >> ./ci-logs/update.md
          fi

      - name: Set PR body output
        id: pr-body-output
        run: |
          {
            echo 'body<<EOF'
            echo '## Automated update'
            echo ''
            echo -n 'started at:  '
            cat ./ci-logs/started_at.txt
            echo -n 'finished at: '
            TZ=Asia/Tokyo date
            echo ''
            cat ./ci-logs/update.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm -rf ./ci-logs/

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.PR_ACTION_APP_ID }}
          private-key: ${{ secrets.PR_ACTION_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Automated updates"
          commit-message: "[bot] update flake.lock"
          branch: auto-updates
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          body: ${{ steps.pr-body-output.outputs.body }}
          token: ${{ steps.app-token.outputs.token }}
          reviewers: happy663
