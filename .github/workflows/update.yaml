name: Update

on:
  schedule:
    - cron: "0 15 */7 * *" # 毎月 1/8/15/22/29 日 UTC 15:00 (JST 翌日 00:00)
  workflow_dispatch:
    inputs:
      ai-smoke-test:
        description: 'Test Pi/Go against the #339 Neovim range without updating flake.lock or creating a PR'
        type: boolean
        default: false


permissions:
  contents: write
  pull-requests: write

jobs:
  ai-smoke-test:
    if: inputs.ai-smoke-test == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect known Neovim changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir ./ci-logs
          python3 .github/scripts/neovim-changelog.py collect \
            --old 1cfebe93d5f9463acda4aa6f69e4faa244734193 \
            --new 63497867b60a738c0454a3b9e25b9726a2eb02e0 \
            --directory ./ci-logs
      - name: Generate explanation with Pi and Go
        timeout-minutes: 5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash .github/scripts/explain-neovim.sh
      - name: Validate explanation and render preview
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          text = Path('ci-logs/neovim-ai.md').read_text()
          assert 0 < len(text) <= 12000, 'AI output is empty or oversized'
          for section in ['設定に影響しそうな破壊的変更', '試す価値のある新機能', 'その他']:
              assert section in text, f'Missing section: {section}'
          source = Path('ci-logs/neovim-source.md').read_text()
          assert 'operatorfunc' in source and 'pathopt' in source
          print(f'Generated {len(text)} characters with all three sections')
          PYTEST
          python3 .github/scripts/neovim-changelog.py render \
            --directory ./ci-logs --ai-ok > ./ci-logs/neovim-preview.md
          cat ./ci-logs/neovim-preview.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neovim-ai-smoke-test
          # Do not upload the full model input or temporary/partial output.
          path: |
            ci-logs/neovim-source.md
            ci-logs/neovim-ai.md
            ci-logs/neovim-preview.md
          retention-days: 7

  create-pr:
    if: inputs.ai-smoke-test != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Initialize log files
        run: |
          mkdir ./ci-logs
          TZ=Asia/Tokyo date > ./ci-logs/started_at.txt
          echo '' > ./ci-logs/update.md

      - name: Snapshot Neovim rev (pre-update)
        id: nvim-before
        run: |
          echo "rev=$(jq -r '.nodes["neovim-src"].locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"

      - name: Update Nix Flake
        run: |
          {
            echo '### nix flake update'
            echo ''
            TZ=Asia/Tokyo date
            echo ''
            echo '```'
          } >> ./ci-logs/update.md
          nix flake update |& tee -a ./ci-logs/update.md
          echo '```' >> ./ci-logs/update.md

      - name: Collect Neovim nightly changelog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_REV: ${{ steps.nvim-before.outputs.rev }}
        run: |
          NEW_REV=$(jq -r '.nodes["neovim-src"].locked.rev' flake.lock)
          python3 .github/scripts/neovim-changelog.py collect \
            --old "$OLD_REV" --new "$NEW_REV" --directory ./ci-logs

      - name: Setup Node for Pi
        if: hashFiles('ci-logs/neovim-input.md') != ''
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Explain Neovim changes with Pi
        id: neovim-ai
        if: hashFiles('ci-logs/neovim-input.md') != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: bash .github/scripts/explain-neovim.sh

      - name: Write PR body
        env:
          AI_OUTCOME: ${{ steps.neovim-ai.outcome }}
        run: |
          {
            echo '## Automated update'
            echo ''
            echo -n 'started at:  '
            cat ./ci-logs/started_at.txt
            echo -n 'finished at: '
            TZ=Asia/Tokyo date
            echo ''
            # Reserve room for Neovim evidence and the AI explanation.
            python3 - <<'PYLOG'
          from pathlib import Path
          log = Path('ci-logs/update.md').read_text(errors='replace')
          print(log[:15000])
          if len(log) > 15000:
              print('\n```\n(nix update log truncated)')
          PYLOG
            AI_ARGS=()
            if [ "$AI_OUTCOME" = success ]; then
              AI_ARGS+=(--ai-ok)
            fi
            python3 .github/scripts/neovim-changelog.py render \
              --directory ./ci-logs "${AI_ARGS[@]}"
          } > "$RUNNER_TEMP/update-pr-body.md"
          # Keep generated logs out of the update commit.
          python3 -c 'import shutil; shutil.rmtree("ci-logs")'

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.PR_ACTION_APP_ID }}
          private-key: ${{ secrets.PR_ACTION_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Automated updates"
          commit-message: "[bot] update flake.lock"
          branch: auto-updates
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
          body-path: ${{ runner.temp }}/update-pr-body.md
          token: ${{ steps.app-token.outputs.token }}
          reviewers: happy663
